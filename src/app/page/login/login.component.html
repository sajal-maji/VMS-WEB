<div class="login-wrapper min-h-screen flex items-center justify-center bg-gray-100">
  <div class="login-card w-full max-w-md bg-white shadow-lg rounded-xl p-8">
    <div class="logo-wrap flex justify-center">
      <img src="/images/newvtplLogo.png" alt="Logo" class="h-14 object-contain" />
    </div>

    <form
      [formGroup]="loginForm"
      (ngSubmit)="login()"
      autocomplete="off"
      class="space-y-3 w-full max-w-sm mx-auto mt-1"
    >
      <!-- Username -->
      <label class="block text-sm font-semibold text-slate-200 mb-1" for="userid">Username</label>
      <div class="relative">
        <input
          id="userid"
          type="text"
          placeholder="Username"
          formControlName="userid"
          required
          autocomplete="off"
          class="w-full bg-transparent rounded-md px-3 py-2 text-slate-100 placeholder:text-slate-400 shadow-[0_0_0_1px_#1a1f28] focus:outline-none focus:ring-0 focus:shadow-[0_0_14px_rgba(143,25,47,0.45)] [&:not(:placeholder-shown)]:focus:shadow-[0_0_16px_rgba(37,99,235,0.45)] transition"
        />
        @if (submitted && loginForm.controls['userid'].errors) {
          <div class="text-sm text-red-500 mt-1">
            @if (loginForm.controls['userid'].errors['required']) {
              <span>Username is required.</span>
            }
          </div>
        }
      </div>

      <!-- Password -->
      <label class="block text-sm font-semibold text-slate-200 mb-1" for="password">Password</label>
      <div class="relative">
        <input
          id="password-field"
          [type]="showPassword ? 'text' : 'password'"
          placeholder="Password"
          formControlName="password"
          required
          autocomplete="off"
          class="w-full bg-transparent rounded-md px-3 py-2 pr-12 text-slate-100 placeholder:text-slate-400 shadow-[0_0_0_1px_#1a1f28] focus:outline-none focus:ring-0 focus:shadow-[0_0_14px_rgba(143,25,47,0.45)] [&:not(:placeholder-shown)]:focus:shadow-[0_0_16px_rgba(37,99,235,0.45)] transition"
        />
        <button
          type="button"
          (click)="togglePassword()"
          class="fa absolute right-3 top-1/2 -translate-y-1/2 w-8 h-8 flex items-center justify-center bg-transparent border-0 p-0 text-slate-400 hover:text-slate-200 hover:bg-transparent focus:bg-transparent active:bg-transparent cursor-pointer focus:outline-none focus:ring-0"
          [ngClass]="showPassword ? 'fa-eye-slash' : 'fa-eye'"
          aria-label="Toggle password visibility"
        ></button>
      </div>
      <!-- @if (submitted && loginForm.controls['password'].errors) {
        <div class="error-text text-sm text-red-600 mt-1">
          @if (loginForm.controls['password'].errors['required']) {
            <span>Password is required.</span>
          }
          @if (loginForm.controls['password'].errors['pattern']) {
            <span
              >Password must be 8-12 chars with 1 uppercase, 1 lowercase, 1 number, and 1 special
              character.</span
            >
          }
        </div>
      } -->

      <!-- Hidden success/fail inputs -->
      <input type="hidden" name="successto" />
      <input type="hidden" name="failto" />

      <!-- Remember Me and Forgot Password -->
      <div class="mt-6 flex items-center justify-between text-sm text-slate-200">
        <label class="flex items-center gap-2.5">
          <input
            type="checkbox"
            id="rememberMe"
            [(ngModel)]="rememberMe"
            [ngModelOptions]="{ standalone: true }"
            name="rememberMe"
            class="accent-blue-600"
          />
          <span>Remember me</span>
        </label>
        <a
          class="text-blue-500 hover:underline"
          routerLink="/ivmsweb/forgot-password"
          (click)="forgotPassword()"
        >
          Forgot Password
        </a>
      </div>

      <!-- Error Message -->
      @if (errorMessage) {
        <div class="text-amber-400 text-sm text-center">
          {{ errorMessage }}
        </div>
      }

      <!-- Submit Button -->
      <button
        type="submit"
        class="!mt-8 block w-24 mx-auto bg-blue-600 text-white py-3 rounded-lg font-semibold hover:bg-blue-700 transition active:scale-[0.98]"
      >
        Login
      </button>
    </form>
  </div>

  <div class="absolute left-1 bottom-1 text-slate-200">
    <app-footer></app-footer>
  </div>
</div>
