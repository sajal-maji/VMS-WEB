<div class="archive-container relative">
  <!-- LEFT -->
  <div class="sidebar">
    <tree (channelClickedEvent)="OnClick($event)" (serverConfig)="OnLoad($event)"></tree>
    <!-- <div class="sidebar-footer">
      <app-footer></app-footer>
    </div> -->
  </div>

  <!-- RIGHT -->
  <div class="main-section flex flex-col flex-1">
    <app-header
      [currentLayout]="currentLayout"
      [allowedLayouts]="allowedLayouts"
      (layoutChange)="onLayoutChange($event)"
    ></app-header>

    <div
      class="grid gap-2 w-full flex-1 overflow-y-auto"
      [style.gridTemplateColumns]="gridTemplate"
    >
      <div
        *ngFor="let player of players; let i = index"
        class="video-container flex flex-col w-full h-full"
      >
        <!-- ================= DATETIME PICKER ================= -->
        <div class="flex justify-end m-2">
          <input
            type="datetime-local"
            class="w-[180px] bg-gray-800 text-white border border-gray-600 rounded px-2 py-1"
            [(ngModel)]="player.selectedDateStr"
            (change)="onDateChange($event, i)"
          />
        </div>

        <!-- ================= VIDEO CONTAINER ================= -->
        <div
          class="w-full relative ui-droppable video-container"
          [attr.context-menu]="options.actionsMenu"
          [attr.model]="i"
        >
          <!-- ================= HEADER ================= -->
          <div class="flex justify-between items-center p-[0.05rem] bg-gray-800 text-white">
            <!-- LEFT -->
            <div class="flex items-center space-x-2 min-w-0">
              <img
                class="w-4 h-4 cursor-pointer ml-2"
                [src]="
                  player.isSpeakerOn ? 'images/SpeakerOnIcon.png' : 'images/SpeakerOffIcon.png'
                "
                *ngIf="player.status == undefined"
                (click)="toggleSpeaker(i)"
              />

              <img
                src="/images/camera/CameraIconIdle.png"
                [src]="getArchiveCameraIcon(player)"
                class="cursor-pointer"
              />

              <div class="truncate font-medium" [attr.title]="player.channelName">
                {{ player.channelName }}
              </div>
            </div>

            <!-- RIGHT -->
            <div class="flex items-center space-x-2">
              <img
                (click)="screenshotClicked(i)"
                src="/images/ScreenshotIcon.png"
                *ngIf="player['sessionId'] != 0 || player['mjpeg_sessionId'] != 0"
                class="w-4 h-4 cursor-pointer"
              />

              <img
                (click)="closeClicked(i)"
                src="/images/CloseIcon.png"
                class="w-6 h-6 cursor-pointer"
              />
            </div>
          </div>

          <!-- ================= VIDEO + CONTROLS ================= -->
          <!-- ✅ THIS WRAPPER CONTAINS ONLY VIDEO & OVERLAY -->
          <div class="relative w-full overflow-hidden bg-black group">
            <video
              [id]="player.elem_id"
              poster="images/postervtpl_new.jpg"
              class="ui-droppable video-elem"
            ></video>

            <!-- CONTROLS OVERLAY -->
            <div
              class="absolute bottom-0 left-0 w-full h-8 bg-gradient-to-t from-black/70 to-transparent flex items-center justify-center gap-2 opacity-0 group-hover:opacity-100 transition z-10"
            >
              <button
                (click)="toggleFullScreen(i)"
                class="w-7 h-7 bg-gray-700 rounded flex items-center justify-center"
              >
                <i class="fa fa-arrows-alt text-white text-xs"></i>
              </button>

              <button
                (click)="frameByFrameBackward(i)"
                [disabled]="player.hlsURL == '' && !player.webrtc"
                class="w-7 h-7 bg-gray-700 rounded flex items-center justify-center disabled:opacity-40"
              >
                <i class="fa fa-caret-left text-white text-xs"></i>
              </button>

              <button
                (click)="fastBackward(i)"
                [disabled]="player.hlsURL == '' && !player.webrtc"
                class="w-7 h-7 bg-gray-700 rounded flex items-center justify-center disabled:opacity-40"
              >
                <i class="fa fa-backward text-white text-xs"></i>
              </button>

              <button
                (click)="playPause(i)"
                [disabled]="player.hlsURL == '' && !player.webrtc"
                class="w-7 h-7 bg-gray-700 rounded flex items-center justify-center disabled:opacity-40"
              >
                <i
                  class="fa text-white text-xs"
                  [class.fa-play]="!player.isplaying"
                  [class.fa-pause]="player.isplaying"
                ></i>
              </button>

              <button
                (click)="fastForward(i)"
                [disabled]="player.hlsURL == '' && !player.webrtc"
                class="w-7 h-7 bg-gray-700 rounded flex items-center justify-center disabled:opacity-40"
              >
                <i class="fa fa-forward text-white text-xs"></i>
              </button>

              <button
                (click)="frameByFrameForward(i)"
                [disabled]="player.hlsURL == '' && !player.webrtc"
                class="w-7 h-7 bg-gray-700 rounded flex items-center justify-center disabled:opacity-40"
              >
                <i class="fa fa-caret-right text-white text-xs"></i>
              </button>

              <div class="relative">
                <button
                  (click)="toggleDropDown()"
                  [disabled]="player.hlsURL == '' && !player.webrtc"
                  class="h-7 px-2 bg-gray-700 text-white text-xs rounded"
                >
                  {{ speedDisplay }}x
                </button>

                <ul
                  *ngIf="isDropdownOpen"
                  class="absolute bottom-full mb-1 w-20 bg-gray-800 border border-gray-700 rounded text-white text-xs z-50"
                >
                  <li
                    class="px-2 py-1 hover:bg-gray-700 cursor-pointer"
                    (click)="changeSpeed(0.125)"
                  >
                    -8x
                  </li>
                  <li
                    class="px-2 py-1 hover:bg-gray-700 cursor-pointer"
                    (click)="changeSpeed(0.25)"
                  >
                    -4x
                  </li>
                  <li class="px-2 py-1 hover:bg-gray-700 cursor-pointer" (click)="changeSpeed(0.5)">
                    -2x
                  </li>
                  <li class="px-2 py-1 hover:bg-gray-700 cursor-pointer" (click)="changeSpeed(1)">
                    1x
                  </li>
                  <li class="px-2 py-1 hover:bg-gray-700 cursor-pointer" (click)="changeSpeed(2)">
                    2x
                  </li>
                  <li class="px-2 py-1 hover:bg-gray-700 cursor-pointer" (click)="changeSpeed(4)">
                    4x
                  </li>
                  <li class="px-2 py-1 hover:bg-gray-700 cursor-pointer" (click)="changeSpeed(8)">
                    8x
                  </li>
                </ul>
              </div>
            </div>
          </div>

          <!-- ✅ ================= BARS BELOW VIDEO ================= -->

          <!-- RECORDING -->
          <div class="flex items-center gap-2 mt-2 px-2">
            <div class="w-20 text-sm text-gray-300">Recording</div>

            <fieldset
              id="recording-progress1"
              class="flex-1 recording-progress"
              [disabled]="player.disable_controls"
            >
              <span
                *ngFor="let barsection of player.barclips"
                class="pointer recording-section"
                [ngStyle]="{
                  'margin-left': $any(barsection).marginleft,
                  width: $any(barsection).width,
                }"
                [attr.title]="
                  ($any(barsection).starttimestamp | date: 'dd MMM yyyy hh:mm:ss a') +
                  ' to ' +
                  ($any(barsection).endtimestamp | date: 'dd MMM yyyy hh:mm:ss a')
                "
                (click)="startPlaying(i, barsection)"
              >
                &nbsp;
              </span>
            </fieldset>
          </div>

          <!-- MOTION -->
          <div class="flex items-center gap-2 mt-1 px-2">
            <div class="w-20 text-sm text-gray-300">Motion</div>

            <fieldset
              id="motion-progress1"
              class="flex-1 motion-progress"
              [disabled]="player.disable_controls"
            >
              <span
                *ngFor="let motionclip of player.motionclips"
                [ngStyle]="{
                  'margin-left': $any(motionclip).marginleft,
                  width: $any(motionclip).width,
                }"
                class="pointer motion-section"
                [attr.title]="
                  ($any(motionclip).startTimestamp | date: 'hh:mm:ss a') +
                  ' to ' +
                  ($any(motionclip).endTimestamp | date: 'hh:mm:ss a')
                "
                (click)="startMotionPlaying(i, motionclip)"
              >
                &nbsp;
              </span>
            </fieldset>
          </div>

          <!-- ERRORS -->
          <span class="block w-full text-center text-yellow-400 text-sm min-h-[22px]">
            {{ player.error }}
          </span>
        </div>
      </div>
    </div>
  </div>
</div>
