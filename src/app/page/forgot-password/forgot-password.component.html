<div class="forgot-wrapper min-h-screen flex items-center justify-center bg-gray-100">
  <div class="forgot-card w-full max-w-md bg-white shadow-lg rounded-xl p-8">
    <div class="logo-wrap flex justify-center">
      <img src="/images/newvtplLogo.png" alt="Logo" class="h-14 object-contain" />
    </div>

    <div class="space-y-4 w-full max-w-sm mx-auto">
      <!-- Email -->
      <label class="block text-sm font-semibold text-slate-200 mb-1" for="email">Email</label>
      <div class="relative">
        <input
          id="email"
          type="text"
          autocomplete="on"
          (input)="validate()"
          [(ngModel)]="model.email"
          placeholder="Email"
          class="w-full bg-transparent rounded-md px-3 py-2 text-slate-100 placeholder:text-slate-400 shadow-[0_0_0_1px_#1a1f28] focus:outline-none focus:ring-0 focus:shadow-[0_0_18px_rgba(143,25,47,0.45)] transition"
        />
      </div>

      <!-- Messages -->
      @if (error_message) {
        <div class="text-sm text-amber-400 text-center">{{ error_message }}</div>
      }
      @if (success_message) {
        <div class="text-sm text-green-400 text-center">{{ success_message }}</div>
      }

      <!-- Actions -->
      <div class="flex items-center justify-between gap-3 pt-2">
        <button
          type="button"
          (click)="forgotPassword()"
          class="inline-flex justify-center items-center w-85 bg-blue-600 text-white py-2.5 rounded-lg font-semibold hover:bg-blue-700 transition active:scale-[0.98]"
        >
          Request Reset Link
        </button>
        <a class="text-blue-500 hover:underline text-sm" href="ivmsweb/login">Login</a>
      </div>
    </div>
  </div>

  <div class="absolute left-1 bottom-1 text-slate-200">
    <app-footer></app-footer>
  </div>
</div>
